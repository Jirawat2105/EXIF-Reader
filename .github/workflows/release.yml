name: Windows release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt pyinstaller==6.22.3
      - run: python scripts/install_exiftool.py
      - run: python -m unittest -v
      - run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: EXIFReader-Windows-x64
          path: |
            dist/EXIFReader-*-Windows-x64.exe
            dist/EXIFReader-*-ThirdPartyNotices.zip
            dist/SHA256SUMS.txt
            build/windows/packaged-self-test.json
